  <title
     id="title2">AnyScan-VLM architecture</title>
  <desc
     id="desc4">How AnyScan-VLM works, top to bottom: a Basler camera and a reference background feed a vision pipeline combining OpenCV background subtraction, FastSAM segmentation, OpenCV mask filtering and the Gemma 4 VLM description; the result is composed into a report and shown in the PyQt5 console.</desc>
