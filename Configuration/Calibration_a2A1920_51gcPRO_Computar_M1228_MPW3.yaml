## =========================================================================== ##
#   Description:
#     The calibration of one piece of hardware (camera + lens), SHARED by every mode
#     configuration that names this hardware (Config_<Hardware>_Mode_<Mode>.yaml), so
#     recalibrating updates every mode at once and no mode can keep measuring with a
#     stale scale.
#
#     Solved and written by Example/Camera/calibrate.py, and only by it, through
#     Configuration.Core.Write_Calibration. The writer owns the 'Calibration' block and
#     REFUSES to write over any key it does not own, so content added here is never
#     silently deleted. Read by Configuration.Core.Load_Configuration.
#
#   Hardware setup:
#     - Camera : Basler a2A1920-51gcPRO
#     - Lens   : Computar M1228-MPW3
#     - Light  : Effilux EFFI-FD-200-200-000
## =========================================================================== ##

# The hardware this calibration belongs to; must equal the hardware part of this file's name.
Hardware: a2A1920_51gcPRO_Computar_M1228_MPW3

Calibration:
  # Camera calibration (intrinsic) matrix K, 3 x 3, row-major.
  K:
    - [3.88598795e+03, 0.00000000e+00, 1.60700960e+02]
    - [0.00000000e+00, 3.89857482e+03, 3.55549173e+02]
    - [0.00000000e+00, 0.00000000e+00, 1.00000000e+00]
  # Distortion coefficients: [k1, k2, p1, p2, k3].
  Coefficients:
    k1: -0.18579372777320677
    k2: 0.5423357370141956
    p1: 0.0033749787534304047
    p2: 0.018164117051808436
    k3: -0.8791801691519703
  # Pixel-to-millimeter conversion factors for the x and y axes [mm/px].
  Conversion_Factor:
    x: 0.09797791724417174
    y: 0.0979737427598743
