[pytest]
# Unit suite for the AnyScan refactor. Tests mirror src/ as test/<Domain>/
# test_<module>.py and run without camera hardware or the model weights.
# Tests that genuinely need the weights are marked `slow` and skipped unless
# --runslow is passed (see test/conftest.py).
# The shipped skills' own checkers are tested in the suite too (stdlib only, about a second); the brand
# skill's template tests are not: they run inside a project that has copied the templates and fonts.
testpaths = test .claude/skills/project-style-rpx/scripts .claude/skills/readme-writer/scripts
# importlib mode lets test/<Domain>/test_<module>.py mirror src/ with duplicate
# basenames (two test_core.py) and no __init__.py packages, which RP does not use.
addopts = --import-mode=importlib
markers =
    slow: needs the model weights (FastSAM, Gemma) or other heavy runtime; skipped unless --runslow.
