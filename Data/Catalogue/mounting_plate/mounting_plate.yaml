## =========================================================================== ##
#   Description:
#     One catalogue item: the part a catalogue mode inspects, and the checks it is held
#     to. Named by a mode file's Catalogue.Item; read, validated as a whole and applied by
#     Configuration.Core (Load_Configuration, Load_Catalogue); no other module reads it.
#
#   Item:
#     Mounting plate: a machined steel plate, 60 x 40 x 8 mm, with two stepped holes
#     (countersink 12 mm, through-hole 6 mm) at a 25 mm pitch. Front: milled, shiny,
#     four circular outlines. Back: unmachined, dark and matte, two circular outlines.
#
#   Folder:
#     Data/Catalogue/<item>/<item>.yaml, with the item's reference images beside it in
#     reference_image/. The file is named after its folder: a new item is a copied
#     folder with both renamed, and a mode file naming it.
#
#   Required and optional:
#     A field marked REQUIRED has no default: a file without it fails to load, naming the
#     field. An optional field states its default; when it is absent the default is used
#     and the log says so. An unrecognised key is logged as a warning.
#
#   Description, Sides, Defects:
#     What the part looks like, on each side, and what is a defect and what is not — the
#     single tracked source for the part, from the catalogue-mode request. Each side's Name
#     is the side sentence of a judged object's description; the side's Description and its
#     Defects go to the describer through Describer.Prompt. Description and
#     Measurement_Rules are for people: validated at load, read by nothing (the dated
#     exception in docs/design-decisions.md, 2026-10-11). What the describer is given holds
#     no number (the loader refuses one): it is told the appearance, never a dimension.
#
#   Checks:
#     Each block under Checks is one check, run with the parameters it sets: the outline,
#     the holes on both sides and stains on the front.
## =========================================================================== ##

# REQUIRED. The item as a person names it.
Name: Mounting plate

# The part as a whole: shape, size, material, features. Default: empty.
Description: >-
  A metal mounting plate, rectangular, 60 x 40 x 8 mm (length x width x thickness). Two
  stepped holes one above the other, their centres 25 mm apart, on an axis 15 mm from one
  long edge (5 mm off the part's long axis) and 17.5 mm from the short edges. From the
  front each hole is a 12 mm countersink around a 6 mm through-hole.

# How a dimension is read on this part, beyond its nominal value. Default: empty.
Measurement_Rules: >-
  The part is symmetric lengthwise: turned by 180 degrees it looks the same, so the holes
  have no top and bottom. Each hole is checked against its nearer short edge, 17.5 mm
  either way. The countersink (10.5-13.5 mm) and through-hole (4.5-7.5 mm) ranges do not
  overlap, so the two diameters cannot be confused.

# REQUIRED. The part's thickness [mm]. NOT measured: the camera looks from above. It is
# USED: the scale is corrected from the calibration board's plane to the part's top face
# with it (Configuration.Core.Scale_At_Height), so a wrong value here moves every size
# this item is checked on by about 0.28 % per millimetre.
Thickness_Mm: 8

# REQUIRED. The tolerance every dimension is checked against unless it sets its own
# [mm]: a dimension passes within nominal ± this, bounds included.
Tolerance_Mm: 1.5

# REQUIRED. The part's two sides, one per reference image (reference_image/<side>.png): each
# side's Name (REQUIRED: the side sentence, 'It lies with its <Name> up.') and Description
# (default: empty). The side is DINOv2's by its margin, else its holes', never the describer's.
Sides:
  front:
    Name: machined front
    Description: >-
      Milled, shiny metal with regular circular to arc-shaped tool marks. About halfway up
      the milled faces meet and the direction of the marks changes; the marks and the
      transition come from machining and are not defects. Stepped holes off the long axis
      towards one long edge, each a large countersink around a smaller through-hole.
      Straight, clean edges with a slight chamfer.
  back:
    Name: unmachined back
    Description: >-
      Not milled, no tool marks: dark grey to brown-black, matte and slightly rough, like
      raw rolled stock with mill scale or oxide. Short dark hairline scratches run mostly
      across the part, square to the long edge. Along both long edges, irregular whitish to
      silver spots where the surface layer is scuffed, a little more near the edge closer to
      the holes; they are not defects and do not tell the orientation. Smooth through-holes
      without countersink. Straight edges, in places a narrow chamfer.

# What is NOK on this part, and what looks like it but is not: one entry per defect, with the
# side it is looked for on. Default: none (a part whose defects are not described yet).
Defects:
  - Name: fingerprint
    Side: front
    Looks_Like: >-
      One or more yellow-brown to brown stains of irregular shape, papillary lines may
      show; clearly unlike the shiny milled metal. Any size; each stain is its own part of
      the report, and one is enough for NOK.
    Not_A_Defect: >-
      Small dark dots, scratches or marks with no papillary lines and no continuous
      yellow-brown area.

# The checks the code runs on the part.
Checks:
  # The outline seen from above. The longer measured side is checked against Length_Mm,
  # the shorter against Width_Mm, so the part's rotation does not matter.
  Outline:
    # REQUIRED, both. The nominal sides [mm]; Length_Mm is the longer.
    Length_Mm: 60
    Width_Mm: 40
    # The outline's own tolerance [mm]. Default: the item's Tolerance_Mm.
    # Tolerance_Mm: 1.5
  # The holes, per side: a list of groups, each holes of one kind. A side without groups has no hole
  # check. Per group: Name, Diameter_Mm [mm] and Count, REQUIRED; From_Long_Edge_Mm and
  # From_Short_Edge_Mm [mm], each centre's distance from its nearer long and short edge (both or
  # neither: a group with them counts only holes near those positions, mirrored to all four corners);
  # Pitch_Mm [mm], neighbouring centres (default: not checked); Tolerance_Mm [mm] (default: the item's).
  # A hole counts in a group when its diameter is within twice the tolerance of the group's, so a
  # hole of the wrong size is reported as the wrong size; two groups of one side may not overlap so.
  # FastSAM finds them on the part's upright crop, the side found up: DINOv2's by its margin, else the side a
  # group only it has shows (the countersinks show the front; Vision.Utilities.Classify.Decide_Side).
  # Measured on the test set (22 plates, 2026-10-11): countersinks 12.07-12.33, through-holes
  # 6.14-6.25 on the front and 6.46-6.73 on the back (the back's openings are wider than the bore,
  # which reads 6.05-6.26 through them: a chamfer, by the look), pitch 24.38-24.92, from the long
  # edge 14.81-16.08, from the short edge 17.45-18.54 mm. A through-hole in its countersink is
  # placed at the countersink and checked for its offset from it, the camera's shift for a bore
  # seen at an angle taken out (Vision.Utilities.Holes, within 0.85 mm; real holes 0.204 at most).
  Holes:
    front:
      - Name: countersink
        Diameter_Mm: 12
        Count: 2
      - Name: through-hole
        Diameter_Mm: 6
        Count: 2
        From_Long_Edge_Mm: 15
        From_Short_Edge_Mm: 17.5
        Pitch_Mm: 25
    back:
      - Name: through-hole
        Diameter_Mm: 6
        Count: 2
        From_Long_Edge_Mm: 15
        From_Short_Edge_Mm: 17.5
        Pitch_Mm: 25
  # Stains, per side (Vision.Utilities.Stain): the pixels of the part's upright crop inside its outline,
  # Edge_Margin_Mm in from it and off its holes, whose colour falls in the band (OpenCV HSV: hue
  # Hue_Min-Hue_Max of 0-179, saturation and value at least Saturation_Min and Value_Min of 255),
  # opened; fragments within Merge_Mm [mm] of each other are one stain region (a fingerprint's ridges break
  # it up); a region holding a fragment of Min_Area_Mm2 [mm^2] or more is a stain (NOK). All REQUIRED.
  # Measured on the test set's fronts (2026-10-11, this table and light): the five fingerprinted
  # plates' largest fragment 144-157 mm^2, every clean front no band pixel left after the opening, so the
  # 1 mm^2 threshold (owner's ruling) has the clean side's margin and catches far smaller stains.
  # The band is the light's: a new light or camera setting is measured again (KNOWN_ISSUES).
  Stain:
    front:
      Hue_Min: 5
      Hue_Max: 30
      Saturation_Min: 50
      Value_Min: 40
      Min_Area_Mm2: 1.0
      Edge_Margin_Mm: 1.0
      # Measured on the five fingerprinted fronts (two fingerprints each, by eye): 2-4 mm gives two regions on
      # every one, 1 mm three or four, 5 mm joins the two across the hole on two plates.
      Merge_Mm: 3.0

# The describer's prompt for a judged part (OK or NOK), filled per part: {side} (the side's Name,
# from DINOv2), {side_description}, {defects} (that side's Defects) and {findings} (what the checks
# found, in words without numbers). The describer only describes: the verdict is the checks', and a
# sentence of its answer stating a measurement or contradicting the verdict is dropped and logged.
# No number may appear here. Default: the mode file's Description.Prompt_Object, without context.
Describer:
  Prompt: >-
    The part is a mounting plate, lying with its {side} up. What that side looks like:
    {side_description} What counts as a defect on this side, and what does not: {defects}
    {findings} In one short flowing paragraph (no lists, no markdown), describe the part as
    you see it: its shape, colour and material, the features you can see, and its surface
    condition, naming where any marks are. Describe only the part, not the surface it lies
    on, and give no measurement and no count.
