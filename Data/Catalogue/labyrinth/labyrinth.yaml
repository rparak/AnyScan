## =========================================================================== ##
#   Description:
#     One catalogue item: the part a catalogue mode inspects, and the checks it is held
#     to. Named by a mode file's Catalogue.Item; read, validated as a whole and applied by
#     Configuration.Core (Load_Configuration, Load_Catalogue); no other module reads it.
#
#   Item:
#     Labyrinth plate: a square steel plate, 50 x 50 x 6 mm. Front: a milled maze and four
#     blind corner holes of 2.459 mm, their centres 4 mm from both adjacent edges. Back:
#     the engraved JIC Smart Factory logo, and no holes.
#
#   Folder:
#     Data/Catalogue/<item>/<item>.yaml, with the item's reference images beside it in
#     reference_image/. The file is named after its folder: a new item is a copied
#     folder with both renamed, and a mode file naming it.
#
#   Required and optional:
#     A field marked REQUIRED has no default: a file without it fails to load, naming the
#     field. An optional field states its default; when it is absent the default is used
#     and the log says so. An unrecognised key is logged as a warning.
#
#   Description, Sides, Defects:
#     What the part looks like, on each side, and what is a defect and what is not — the
#     single tracked source for the part, from the catalogue-mode request. Each side's Name
#     is the side sentence of a judged object's description; the side's Description and its
#     Defects go to the describer through Describer.Prompt. Description and
#     Measurement_Rules are for people: validated at load, read by nothing (the dated
#     exception in docs/design-decisions.md, 2026-10-11). What the describer is given holds
#     no number (the loader refuses one): it is told the appearance, never a dimension.
#
#   Checks:
#     Each block under Checks is one check, run with the parameters it sets: the outline,
#     the corner holes on the front and the logo on the back.
## =========================================================================== ##

# REQUIRED. The item as a person names it.
Name: Labyrinth plate

# The part as a whole: shape, size, material, features. Default: empty.
Description: >-
  A square metal plate, 50 x 50 x 6 mm (length x width x thickness). On the front, a
  milled maze and four blind corner holes of 2.459 mm, placed symmetrically. On the back,
  the engraved JIC Smart Factory logo.

# How a dimension is read on this part, beyond its nominal value. Default: empty.
Measurement_Rules: >-
  The part is square and its corner holes symmetric, so turned by 90 degrees their layout
  looks the same. Each corner hole is checked against its two nearest edges, 4 mm from
  each, whatever the orientation; neighbouring holes are 42 mm apart (50 - 2 x 4).

# REQUIRED. The part's thickness [mm]. NOT measured: the camera looks from above. It is
# USED: the scale is corrected from the calibration board's plane to the part's top face
# with it (Configuration.Core.Scale_At_Height), so a wrong value here moves every size
# this item is checked on by about 0.28 % per millimetre.
Thickness_Mm: 6

# REQUIRED. The tolerance every dimension is checked against unless it sets its own
# [mm]: a dimension passes within nominal ± this, bounds included.
Tolerance_Mm: 1.0

# REQUIRED. The part's two sides, one per reference image (reference_image/<side>.png): each
# side's Name (REQUIRED: the side sentence, 'It lies with its <Name> up.') and Description
# (default: empty). The side is DINOv2's, never the describer's.
Sides:
  front:
    Name: maze side
    Description: >-
      Matte grey metal with fine grinding marks. A milled maze whose channels have a flat,
      bright floor, clearly lighter than the surface around them. Small blind holes in the
      corners, each with the drill's point visible in the middle. At the ends of the maze's
      start and finish channels, small round features of about the corner holes' size, with
      a rounded triangular shape: the maze's start and finish. They are not holes and not
      defects.
  back:
    Name: logo side
    Description: >-
      No holes: the corner holes are blind and do not show from the back. The engraved JIC
      Smart Factory logo: a large "JIC" and below it a smaller "Smart Factory".

# What is NOK on this part, and what looks like it but is not: one entry per defect, with the
# side it is looked for on. Default: none (a part whose defects are not described yet).
Defects:
  - Name: corner hole count
    Side: front
    Looks_Like: >-
      A corner hole missing, or an extra one. Each missing or extra hole is its own part
      of the report. The maze's start and finish are not counted.
  - Name: incomplete logo
    Side: back
    Looks_Like: >-
      The "JIC" or the "Smart Factory" inscription missing, any letter of either missing,
      or no inscription at all. Each missing element is its own part of the report.

# The checks the code runs on the part.
Checks:
  # The outline seen from above. The longer measured side is checked against Length_Mm,
  # the shorter against Width_Mm, so the part's rotation does not matter.
  Outline:
    # REQUIRED, both. The nominal sides [mm]; Length_Mm is the longer.
    Length_Mm: 50
    Width_Mm: 50
    # The outline's own tolerance [mm]. Default: the item's Tolerance_Mm.
    # Tolerance_Mm: 1.0
  # The holes, per side: a list of groups, each holes of one kind. A side without groups has no hole
  # check. Per group: Name, Diameter_Mm [mm] and Count, REQUIRED; From_Long_Edge_Mm and
  # From_Short_Edge_Mm [mm], each centre's distance from its nearer long and short edge (both or
  # neither: a group with them counts only holes near those positions, mirrored to all four corners);
  # Pitch_Mm [mm], neighbouring centres (default: not checked); Tolerance_Mm [mm] (default: the item's).
  # A hole counts in a group when its diameter is within twice the tolerance of the group's, so a
  # hole of the wrong size is reported as the wrong size; two groups of one side may not overlap so.
  # FastSAM finds them on the part's upright crop, the side DINOv2 found up (Vision.Utilities.Holes).
  # The corner holes are blind: the back has none, so a plate lying back up is not judged on its
  # holes (README > Limitations). The maze's start and finish marks, round and of the holes' size,
  # lie at least 4.9 mm from every corner position, so they are not counted. Measured on the test set
  # (the 12 fronts that have corner holes, 2026-10-11): diameters 2.74-3.12 (the openings are larger
  # than the 2.459 drill, by the look a chamfer; the mask follows the visible edge), from each edge
  # 3.63-4.41, neighbouring pitch 41.54-41.99 mm.
  Holes:
    front:
      - Name: corner hole
        Diameter_Mm: 2.459
        Count: 4
        From_Long_Edge_Mm: 4
        From_Short_Edge_Mm: 4
        Pitch_Mm: 42
  # The engraved logo, per side (Vision.Utilities.Logo). Expected_Text: the words, in reading order,
  # each missing letter reported with its word. References: the logo's variants, each an Image
  # (reference_image/<Image>.png with its YOLO .txt), the Rotation_Deg (-180 to 180, counter-
  # clockwise) about the box's centre that makes its box crop read upright and level, and its Letters
  # ([letter, x, y, width, height] in that crop's pixels, in reading order; they must spell
  # Expected_Text). Example/Catalogue/logo_letters.py draws and prints them. A part's crop is
  # registered to each reference by SIFT features; with fewer than Min_Matches on every reference it
  # has no inscription (NOK). Each letter is compared with that letter in every reference it
  # registered to (edge-image correlation, CLAHE first, the best kept) and is there at
  # Letter_Min_Similarity and Letter_Min_Contrast (its edges against the part's own plate, 1 = as
  # strong as the plate's texture) or more; else it is missing (NOK). All REQUIRED.
  # Measured on the test set's 16 backs (2026-10-11): the 4 blank plates register with at most 12
  # matches, every logo with at least 54. The 11 complete logos: each letter's similarity at least
  # 0.77 and contrast at least 3.24. Each of their 165 letters erased in turn (synthetic, inpainted):
  # similarity at most 0.47, except two J at 0.58-0.59 whose inpainted seam keeps the J's shape at
  # contrast 0.18-0.19; every one caught. Thresholds midway (0.62) and at the plate's own texture (1.0).
  # Image_092's right plate (dark, scratched, glare) scored 0.19 against the first three references; it is
  # the fourth (back_dark) since 2026-10-11, and the 165 erasures are still caught with it.
  Logo:
    back:
      Expected_Text: [JIC, SMART, FACTORY]
      Min_Matches: 30
      Letter_Min_Similarity: 0.62
      Letter_Min_Contrast: 1.0
      References:
        # Filled letters (the reference image of the back).
        - Image: back
          Rotation_Deg: 0
          Letters:
            - [J, 61, 115, 128, 128]
            - [I, 250, 119, 29, 122]
            - [C, 340, 117, 121, 128]
            - [S, 66, 291, 32, 46]
            - [M, 98, 291, 46, 46]
            - [A, 144, 291, 37, 46]
            - [R, 181, 291, 37, 46]
            - [T, 218, 291, 31, 46]
            - [F, 68, 349, 24, 45]
            - [A, 92, 349, 33, 45]
            - [C, 125, 349, 42, 45]
            - [T, 167, 349, 23, 45]
            - [O, 190, 349, 41, 45]
            - [R, 231, 349, 36, 45]
            - [Y, 267, 349, 32, 45]
        # Outline letters, a valid variant (owner's ruling, 2026-10-11): Image_092's left plate. JIC
        # from the tool; the small letters set by hand (too faint for its threshold), checked drawn.
        - Image: back_outline
          Rotation_Deg: 0
          Letters:
            - [J, 77, 155, 123, 133]
            - [I, 242, 141, 47, 122]
            - [C, 333, 112, 138, 137]
            - [S, 86, 340, 36, 43]
            - [M, 122, 332, 36, 46]
            - [A, 157, 327, 43, 43]
            - [R, 200, 322, 35, 46]
            - [T, 235, 317, 35, 46]
            - [F, 100, 395, 38, 45]
            - [A, 132, 392, 43, 41]
            - [C, 168, 385, 40, 45]
            - [T, 200, 380, 35, 45]
            - [O, 232, 375, 33, 45]
            - [R, 265, 370, 35, 43]
            - [Y, 297, 365, 33, 43]
        # The same variant on Image_069's plate (index 3), its frame turned 24.3 degrees to level it.
        # One outline reference is not enough: each plate's light falls off on another side, so
        # 092's dim S, F, A and C fail 069 and 095 (0.19-0.20), and 069's fail 092 (0.09). Boxes
        # carried over from back_outline by the SIFT registration between the two, checked drawn.
        - Image: back_outline_2
          Rotation_Deg: 24.3
          Letters:
            - [J, 95, 171, 124, 134]
            - [I, 261, 157, 47, 122]
            - [C, 352, 128, 138, 137]
            - [S, 104, 357, 37, 43]
            - [M, 140, 349, 37, 46]
            - [A, 176, 344, 43, 43]
            - [R, 219, 339, 35, 46]
            - [T, 254, 333, 35, 47]
            - [F, 118, 412, 39, 45]
            - [A, 151, 409, 43, 41]
            - [C, 187, 402, 40, 45]
            - [T, 219, 397, 35, 45]
            - [O, 251, 392, 33, 45]
            - [R, 284, 387, 35, 43]
            - [Y, 316, 382, 33, 43]
        # The filled letters on a dark, scratched, glare-lit plate, the engraving lighter than the plate
        # (Image_092's right plate, index 2), its frame turned 5.6 degrees to level it: a reference for that
        # appearance, which scored 0.19 against the others (owner's ruling, 2026-10-11). Boxes carried over
        # from back by the SIFT registration between the two, checked drawn.
        - Image: back_dark
          Rotation_Deg: 5.6
          Letters:
            - [J, 65, 123, 128, 128]
